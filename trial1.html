<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 200px;
            width: 200px;
            background-color: rgb(10, 26, 74);
             display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            
        }
        .box::before,
        .box::after
        {
            content: "";
            width: 100%;
            height: 100%;
            position: absolute;
            background: conic-gradient(from 0deg at center,red,yellow,blue);
            z-index: -2;
            padding: 2px;
        }
        .box::after{
       filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
